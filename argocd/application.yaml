apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: py-app
  namespace: argocd
spec:
  destination:
    namespace: python-ns
    server: https://mygapclust-kubedemo1-0018de-5tx1ye76.hcp.southindia.azmk8s.io:443
  project: default
  source:
    helm:
      valueFiles:
      - values.yaml
    path: py-app-helm
    repoURL: https://github.com/mohitdevopsorg/gitops-repo-py
    targetRevision: main
  syncPolicy:
    syncOptions:
    - CreateNamespace=true